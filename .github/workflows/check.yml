name: Checks
on: [push, pull_request]
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd popup install --frozen-lockfile
      - run: yarn --cwd content-scripts install --frozen-lockfile
      - run: yarn --cwd popup lint
      - run: yarn test
      - run: yarn scan:build && git diff --exit-code -- diagnostics/scan-x.js
      - run: yarn build --browser all
        env:
          NEXT_TELEMETRY_DISABLED: 1
